<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack</title>
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-dark px-1" data-bs-theme="dark">
    <div class="container-fluid">
      <h1><a class="navbar-brand" href="#">Blackjack</a></h1>
      <div>
        <div class="div-botones">
          <button id="btn-nuevo-juego" class="btn btn-danger">Nuevo Juego</button>
          <button id="btn-pedir-carta" class="btn btn-primary">Pedir Carta</button>
          <button id="btn-detener-juego" class="btn btn-primary">Detener</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-3 text-center">
    <div class="row container">
      <div class="col">
        <h3>Jugador 1 - <span id="puntos-jugador">0</span> Puntos</h3>
        <div id="cartas-jugador" class="divCartas">

        </div>
      </div>
    </div>

    <div class="row container mt-4">
      <div class="col">
        <h3>Computadora - <span id="puntos-computadora">0</span> Puntos</h3>
        <div id="cartas-computadora" class="divCartas">

        </div>
      </div>
    </div>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
